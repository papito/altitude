# The test database, which the PostgreSQL suites reach on port 5433. Every make target that runs them starts it
# (`make test-db`); `make db` starts it with compose.dev.yaml's.

# The same project as compose.dev.yaml: see the comment there.
name: altitude

services:
  altitude_core_postgres_test_db:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    ports:
      - "5433:5432"
    networks:
      - db
    environment:
      - POSTGRES_NAME=altitude-test
      - POSTGRES_USER=altitude-test
      - POSTGRES_PASSWORD=testdba
    container_name: altitude-core-postgres-test
    # What `make test-db`'s --wait waits for. Over TCP, since the image's first-start setup runs a server on the
    # socket alone, which would pass a socket check before the real server starts.
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "altitude-test"]
      interval: 10s
      start_period: 30s
      start_interval: 1s
networks:
  db:
    driver: bridge
