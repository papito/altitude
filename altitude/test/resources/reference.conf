test.dir=test-data

# fs.data.dir comes from altitude/resources/reference.conf and is put under test.dir at runtime ("test-data/data")

# No effect: altitude/resources/reference.conf is earlier on the test classpath, so its db.engine wins. A suite's instance
# sets its engine itself, and the controller tests' server (App.altitude) runs on SQLite with their fixtures
db.engine=postgres

db.sqlite.rel_db_path=test.sqlite.db
# db.sqlite.url is set at runtime from test.dir and this path

