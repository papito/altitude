# Only what decides the shape of the process at startup is set here. The face detection and recognition thresholds, the video
# sampling, the map tiles and the geocoder, the PostgreSQL read statement timeout, the pipeline shutdown timeout and the import
# parallelism are Settings, edited by an Admin on the Settings screen and stored in the database; a leftover key for one of them
# here or in application.conf is ignored. One key here caps a Setting on purpose: import.parallelism.max.

fs.data.dir=data

storage.engine.default=fs

# DEV-only convenience: if both are set, unauthenticated requests will attempt an automatic login.
# Set these in your local application-dev.conf or via environment overrides, not in production.
dev.user=""
dev.password=""
# DEV-only: the first time the server sends a query of a new shape, explain it and append the plan to sql-debug.log in the
# project root (emptied at startup). Postgres runs each new read one extra time for it (EXPLAIN ANALYZE). Ignored outside
# ENV=dev.
dev.sql_explain=false
# DEV-only: a pipeline queue (import, purge) whose stream fails restarts it after a backoff of 1 to 30 seconds, instead of
# staying down until the server restarts. What was in flight when it failed is lost, and offers made during the backoff are
# refused. Ignored outside ENV=dev.
dev.restart_pipeline=false

db.postgres.user=altitude
db.postgres.password=dba
db.postgres.url="jdbc:postgresql://localhost/altitude"
# Connections come from a pool. Left unset, it has a connection per core, for requests running at once, plus five for the import
# pipeline (a transaction at most per database stage of a repository's import), and never fewer than 10.
# db.postgres.pool_size=10
# What every connection opens with. JIT compilation costs the search statements more than it saves. Pooled connections switch to
# server-side prepared statements, whose generic plans cannot see the length of an ID array or how selective a text term is; custom
# plans keep both visible. 64 MB keeps the ID sets of a broad text search hashed up to about a million IDs.
db.postgres.options="-c jit=off -c plan_cache_mode=force_custom_plan -c work_mem=64MB"

db.sqlite.rel_db_path=db/altitude.db
# db.sqlite.url will be set at runtime
# becoming something like "jdbc:sqlite:/path/to/data/db/altitude.db"
# SQLite reads through a pool of this many connections and writes through one
db.sqlite.read_pool_size=4

# A connection a transaction holds longer than this is logged with the stack trace of its borrower; 0 turns the check off
db.pool.leak_detection_threshold=60s

db.engine=sqlite

# Set to true to dump detection debug images into the project debug/ folder
face.debug.enabled=false

# The most threads the import's work may take, whatever the import.parallelism Setting says, for a machine where no Admin tunes
# anything. 0 is no cap, and any other value under 2 stops the server at startup. A leftover import.parallelism=N hides this key:
# no cap applies, and a WARN at startup says so.
import.parallelism.max=0
