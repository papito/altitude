fs.data.dir=data

storage.engine.default=fs

# DEV-only convenience: if both are set, unauthenticated requests will attempt an automatic login.
# Set these in your local application-dev.conf or via environment overrides, not in production.
dev.user=""
dev.password=""

db.postgres.user=altitude
db.postgres.password=dba
db.postgres.url="jdbc:postgresql://localhost/altitude"

db.sqlite.rel_db_path=db/altitude.db
# db.sqlite.url will be set at runtime
# becoming something like "jdbc:sqlite:file:data/db/altitude.db"

db.engine=sqlite

# Face detection & recognition settings
face.yunet.confidence_threshold=0.80
face.yunet.nms_threshold=0.2
face.detection.bounding_box_size=960
face.detection.min_face_size=50
face.recognition.cosine_distance_threshold=0.55
face.recognition.max_comparisons_per_person=12
face.recognition.match_count=3

# Set to true to dump detection debug images into the project debug/ folder
face.debug.enabled=false

# Video. The Faces and the Preview of a video come from its Sampled frames: evenly spaced from the start at whichever is
# longer, the interval below or the duration divided by the maximum count, so a short clip is sampled every second and a
# two-hour recording about every minute.
video.faces.sample_interval_ms=1000
video.faces.max_sampled_frames=120
# The Preview is the first Sampled frame whose mean brightness (0 to 255) clears this floor, which skips a black leader or
# a fade-in; when no frame does, the frame at a tenth of the duration.
video.preview.min_luminance=40

# Map view. Every tile the browser loads tells the tile host which part of the world you are looking at; the default is the
# public OpenStreetMap raster service (see https://operations.osmfoundation.org/policies/tiles/). Point the template at a
# self-hosted tile server to keep that traffic on your own network. {z}/{x}/{y} are filled in by the map.
map.tile.url="https://tile.openstreetmap.org/{z}/{x}/{y}.png"
map.tile.attribution="&copy; <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap</a> contributors"

# Place-name search in the Add Location dialog. Off by default: every query is sent, through this server, to the geocoder
# below (a Nominatim-compatible endpoint; see https://operations.osmfoundation.org/policies/nominatim/ for the public one).
map.geocoder.enabled=false
map.geocoder.url="https://nominatim.openstreetmap.org/search"
