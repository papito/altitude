fs.data.dir=data

storage.engine.default=fs

# DEV-only convenience: if both are set, unauthenticated requests will attempt an automatic login.
# Set these in your local application-dev.conf or via environment overrides, not in production.
dev.user=""
dev.password=""
# DEV-only: the first time the server sends a query of a new shape, explain it and append the plan to sql-debug.log in the
# project root (emptied at startup). Postgres runs each new read one extra time for it (EXPLAIN ANALYZE). Ignored outside
# ENV=dev.
dev.sql_explain=false

db.postgres.user=altitude
db.postgres.password=dba
db.postgres.url="jdbc:postgresql://localhost/altitude"
# Connections come from a pool. Left unset, it has a connection per core, for requests running at once, plus four for the import
# pipeline (a transaction at most per asynchronous stage of each repository's import), and never fewer than 10.
# db.postgres.pool_size=10
# What every connection opens with. JIT compilation costs the search statements more than it saves. Pooled connections switch to
# server-side prepared statements, whose generic plans cannot see the length of an ID array or how selective a text term is; custom
# plans keep both visible. 64 MB keeps the ID sets of a broad text search hashed up to about a million IDs.
db.postgres.options="-c jit=off -c plan_cache_mode=force_custom_plan -c work_mem=64MB"
# A read statement running longer is cancelled, and the search answers 503 instead of holding a backend
db.postgres.read_statement_timeout=30s

db.sqlite.rel_db_path=db/altitude.db
# db.sqlite.url will be set at runtime
# becoming something like "jdbc:sqlite:file:data/db/altitude.db"
# SQLite reads through a pool of this many connections and writes through one
db.sqlite.read_pool_size=4

# A connection a transaction holds longer than this is logged with the stack trace of its borrower; 0 turns the check off
db.pool.leak_detection_threshold=60s

db.engine=sqlite

# Face detection & recognition settings
# Detector score floor; a non-face rarely scores 0.85, a sharp face 0.91 to 0.95, a blurred one 0.80 to 0.90
face.yunet.confidence_threshold=0.85
# Non-maximum suppression, OpenCV's YuNet default: tighter and one of two cheek-to-cheek faces is suppressed as a duplicate
face.yunet.nms_threshold=0.3
# Detection runs on the image shrunk to fit this square, so it decides how small a face in a 12 to 48 MP photo can be found
face.detection.bounding_box_size=1280
# Smallest face box in original pixels
face.detection.min_face_size=50
face.recognition.cosine_distance_threshold=0.55
# Nearest candidates that vote; a tie goes to the closest
face.recognition.match_count=5
# PostgreSQL only: how many candidates a search of the vector index keeps as it goes (pgvector's hnsw.ef_search). Higher finds
# more of the true nearest Faces and reads more of the index; it must be at least four times match_count.
face.recognition.hnsw_ef_search=100
# Face quality is the L2 norm of the raw ArcFace embedding (higher = more recognizable). A Face at or above enroll_threshold
# is enrolled: it can start a new Person and is a match candidate. Between keep_threshold and enroll_threshold it is
# match-only: it may join a known Person but never starts one and is not a candidate. Below keep_threshold it is dropped.
# Calibrated on the test portraits: sharp faces 18.8 to 22.4, the same faces blurred at 5% of their width 15.1 to 19.6, at
# 8% 14.3 to 17.3, eyes covered 15.9 to 19.5. Run with face.debug.enabled=true to read the norms of your own files.
face.quality.enroll_threshold=18.0
face.quality.keep_threshold=15.0

# Set to true to dump detection debug images into the project debug/ folder
face.debug.enabled=false

# Video. The Faces and the Preview of a video come from its Sampled frames: evenly spaced from the start at whichever is
# longer, the interval below or the duration divided by the maximum count, so a short clip is sampled every second and a
# two-hour recording about every minute.
video.faces.sample_interval_ms=1000
video.faces.max_sampled_frames=120
# A person seen in fewer Sampled frames than this is match-only in that Video: the Face may join a known Person but cannot
# start one
video.faces.min_cluster_frames=2
# The Preview is the first Sampled frame whose mean brightness (0 to 255) clears this floor, which skips a black leader or
# a fade-in; when no frame does, the frame at a tenth of the duration.
video.preview.min_luminance=40

# Map view. Every tile the browser loads tells the tile host which part of the world you are looking at; the default is the
# public OpenStreetMap raster service (see https://operations.osmfoundation.org/policies/tiles/). Point the template at a
# self-hosted tile server to keep that traffic on your own network. {z}/{x}/{y} are filled in by the map.
map.tile.url="https://tile.openstreetmap.org/{z}/{x}/{y}.png"
map.tile.attribution="&copy; <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap</a> contributors"

# Place-name search in the Add Location dialog. Off by default: every query is sent, through this server, to the geocoder
# below (a Nominatim-compatible endpoint; see https://operations.osmfoundation.org/policies/nominatim/ for the public one).
map.geocoder.enabled=false
map.geocoder.url="https://nominatim.openstreetmap.org/search"
