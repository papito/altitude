# Only what shapes the process at startup is set here. Tunable values (face thresholds, video sampling, map tiles, timeouts,
# import parallelism) are Settings stored in the database; a leftover key for one of them in a config file is ignored.
#
# These are the defaults. A key of the config file (application.conf in the application's folder, or the file ALTITUDE_CONFIG
# names) wins over them, and an environment variable wins over the file: a key that has a variable names it in its comment, and
# environment.conf holds the substitutions.
#
# Logging has no key: logback starts before any config is read. Prod logs by logback.xml, which reads ALTITUDE_LOG_FORMAT
# (text or json, default text) and ALTITUDE_LOG_LEVEL (TRACE, DEBUG, INFO, WARN, ERROR or OFF, default INFO) from the
# environment, or from a system property of the same name.

# The address the server binds: ALTITUDE_HOST and ALTITUDE_PORT. localhost takes requests from this machine alone; 0.0.0.0 takes
# them on every network interface.
server.host=localhost
server.port=8080
# ALTITUDE_SECURE_COOKIES. Whether the session cookie is Secure, which a browser keeps over HTTPS, or over plain HTTP on
# localhost alone. Set it to false only to sign in over plain HTTP on a LAN or VPN address; the start logs a WARN while it is.
server.secure_cookies=true

# ALTITUDE_DATA_DIR. The Data directory: the database, every Library's files and the uploads not yet imported. An absolute path
# is used as it is; a relative one is under the application's folder.
fs.data.dir=data

# ALTITUDE_MODELS_DIR. The Models directory, where the model files are (about 1.6 GB); a start that misses one downloads it.
# Empty is the per-user cache, $XDG_CACHE_HOME/altitude/models else ~/.cache/altitude/models, shared by the dev server, tests
# and worktrees. A relative path other than ~/ is under the application's folder. In a container, point the variable at a
# volume; a user with no home directory must set one of the two. The substitution is here as well as in environment.conf,
# since the tests read this file alone.
models.dir=""
models.dir=${?ALTITUDE_MODELS_DIR}

storage.engine.default=fs

# DEV-only: when both are set, unauthenticated requests log in as this user. Set them in application-dev.conf.
dev.user=""
dev.password=""
# DEV-only: explain each new query shape once and append the plan to sql-debug.log (emptied at startup). On Postgres this runs
# each new read one extra time (EXPLAIN ANALYZE).
dev.sql_explain=false
# DEV-only: a failed pipeline stream restarts after a 1-30 s backoff instead of staying down until the server restarts. What was
# in flight is lost, and offers during the backoff are refused.
dev.restart_pipeline=false

# ALTITUDE_DB_POSTGRES_USER, ALTITUDE_DB_POSTGRES_PASSWORD and ALTITUDE_DB_POSTGRES_URL. With db.engine=postgres an empty
# password fails the start.
db.postgres.user=altitude
db.postgres.password=dba
db.postgres.url="jdbc:postgresql://localhost/altitude"
# Left unset: a connection per core for requests, plus six for the import pipeline (one per database stage), at least 10.
# db.postgres.pool_size=10
# JIT costs the search statements more than it saves. Generic plans of server-side prepared statements cannot see the length of
# an ID array or a text term's selectivity; custom plans can. 64 MB keeps a broad text search's ID sets hashed up to ~1M IDs.
db.postgres.options="-c jit=off -c plan_cache_mode=force_custom_plan -c work_mem=64MB"

db.sqlite.rel_db_path=db/altitude.db
# db.sqlite.url is set at runtime from fs.data.dir and this path
# SQLite reads through a pool of this many connections and writes through one
db.sqlite.read_pool_size=4
# How long a writer waits for the one write connection while other writers hold it in turn, before it fails: longer than the
# longest write (a folder delete over tens of thousands of assets, an account's importer records rewritten), with the writers
# queued behind it
db.sqlite.write_connection_timeout=10m

# A connection a transaction holds longer than this is logged with the stack trace of its borrower; 0 turns the check off
db.pool.leak_detection_threshold=60s

# ALTITUDE_DB_ENGINE: sqlite or postgres. SQLite keeps its file in the Data directory, on a local disk: the start logs a WARN
# when it is on a network share, a host folder shared into a container or a mount through FUSE.
db.engine=sqlite

# Set to true to dump detection debug images into the project debug/ folder
face.debug.enabled=false

# ALTITUDE_IMPORT_PARALLELISM_MAX. Caps the import.parallelism Setting, for a machine no Admin tunes. 0 is no cap; any other
# value under 2 stops the startup. A leftover import.parallelism=N in the config file hides this key unless the variable sets
# it: no cap applies, and a WARN says so.
import.parallelism.max=0
