# The environment variables that set a config key, layered over the config file (Altitude.loadConfig): a variable wins over the
# file, which wins over reference.conf. Substitutions alone belong here; a key's default and meaning are in reference.conf.
# ALTITUDE_LOG_FORMAT and ALTITUDE_LOG_LEVEL set no key and are not here: logback reads them before any config (LogSettings).
#
# A variable that is set but empty sets its key to an empty value, never to the key's default. The start refuses an empty
# host, port, Data directory and, on PostgreSQL, password, each by its variable's name.
server.host=${?ALTITUDE_HOST}
server.port=${?ALTITUDE_PORT}
server.secure_cookies=${?ALTITUDE_SECURE_COOKIES}
fs.data.dir=${?ALTITUDE_DATA_DIR}
db.engine=${?ALTITUDE_DB_ENGINE}
db.postgres.url=${?ALTITUDE_DB_POSTGRES_URL}
db.postgres.user=${?ALTITUDE_DB_POSTGRES_USER}
db.postgres.password=${?ALTITUDE_DB_POSTGRES_PASSWORD}
import.parallelism.max=${?ALTITUDE_IMPORT_PARALLELISM_MAX}
models.dir=${?ALTITUDE_MODELS_DIR}
