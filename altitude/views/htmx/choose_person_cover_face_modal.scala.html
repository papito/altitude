@import altitude.core.Const
@import altitude.core.RequestContext
@import altitude.core.models.Person
@import altitude.core.models.Face
@import altitude.core.Api

@(person: Person, faces: List[Face], title: String)

<div id="faceSelector"
     data-app-fragment="modal"
     data-app-modal-title="@{title}"
     data-app-success-event="PERSON_COVER_FACE_SET_EVENT"
     data-app-success-detail='{"@{ Api.Field.PERSON_ID }":"@{ person.persistedId }"}'
     data-app-success-detail-target-attr-face-id="data-face-id">
    <div class="info">
        <div>
            Best faces for <strong>@{person.name}</strong>
        </div>
    </div>

    <div class="faces">
        @for(face <- faces) {
            <img src="/content/r/@{RequestContext.getRepository.persistedId}/@{Const.DataStore.FACE}/@{face.persistedId}"
                 alt="Face option for @{person.name}"
                 data-face-id="@{face.persistedId}"
                 hx-swap="innerHTML"
                 hx-target="#person"
                 hx-put="/htmx/people/r/@{RequestContext.getRepository.persistedId}/p/@{person.persistedId}/cover-image?@{Api.Field.FACE_ID}=@{face.persistedId}"
                 hx-trigger="click"
            >
        }
    </div>

</div>
