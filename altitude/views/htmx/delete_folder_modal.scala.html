@import altitude.core.RequestContext
@import altitude.core.models.Folder
@import altitude.core.Api

@(folder: Folder, title: String)

<style>
    #modalContent {
        display: grid;
        grid-template-columns: 1fr;
        place-items: center;
    }
</style>

@* The dialog is placed on the folder's own row, which exists while it is open, but focus returns
   to the parent's menu control, which is what survives the deletion *@
<button class="action-button error"
        id="deleteFolder"
        data-app-fragment="modal"
        data-app-modal-title="@{title}"
        data-app-modal-return-focus="#folderMenuCtrl-@{folder.parentId}"
        data-app-modal-anchor-x="#explorer"
        data-app-modal-anchor-y="#folderMenuCtrl-@{folder.persistedId}"
        data-app-modal-success-event="folderDeleted"
        data-app-modal-success-detail='{"@{Api.Field.ID}":"@{folder.persistedId}"}'
        hx-swap="none"
        hx-delete="/htmx/folder/r/@{RequestContext.getRepository.persistedId}"
        hx-trigger="click"
        hx-vals='{"@{Api.Field.ID}": "@{folder.persistedId}"}'>
    Delete "<strong>@{folder.name}</strong>" and move assets into Recycle Bin
</button>
