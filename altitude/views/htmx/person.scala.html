@import altitude.core.models.Person
@(person: Person)

@* The person scope's results title: the drop zone of a face merge and the swap target of the Hide / Show / Discard
   responses, which return htmx/person_inner. *@
<div id="person" class="results-title dropzone" x-data data-person-id="@{person.persistedId}">
    @htmx.html.person_inner(person)
</div>
