@import altitude.core.Api
@import altitude.core.RequestContext

@(minWidth: Int, title: String)

<style>
  #viewSettingsModalForm {
    display: grid;
    grid-auto-rows: auto;
    row-gap: var(--control-vertical-space);
  }

  #viewSettingsModalForm input[type="checkbox"] {
    vertical-align: middle;
  }
</style>

<!-- NOTE: The "value" here mirrors the ones in the search results grid, so these are
     the classes we show/hide in the grid. -->

<form id="viewSettingsModalForm"
      data-app-fragment="modal"
      data-app-modal-kind="view-settings"
      data-app-modal-title="@{title}"
      data-app-modal-min-width="@{minWidth}">
  <label>
    <input type="checkbox"
           id="fileNameCheckbox"
           value="fileName"> File Name
  </label>

  <label>
    <input type="checkbox"
           id="originalCreatedAtCheckbox"
           value="originalCreatedAt"> Date/Time Created
  </label>

  <label>
    <input type="checkbox"
           id="importedAtCheckbox"
           value="importedAt"> Date/Time Imported
  </label>

  <label>
    <input type="checkbox"
           id="dimensionsCheckbox"
           value="dimensions"> Media Dimensions
  </label>

  <label>
    <input type="checkbox"
           id="fileSizeCheckbox"
           value="fileSize"> File Size
  </label>
</form>
