@import altitude.core.RequestContext
@import altitude.core.models.Folder
@import altitude.core.Api

@(folder: Folder, title: String)

@* Focus returns to the parent's menu control, which survives the deletion *@
<div id="deleteFolder"
     data-app-fragment="modal"
     data-app-modal-title="@{title}"
     data-app-dialog-return-focus="#folderMenuCtrl-@{folder.parentId}"
     data-app-success-event="FOLDER_DELETED_EVENT"
     data-app-success-detail='{"@{Api.Field.ID}":"@{folder.persistedId}"}'>

    <button type="button"
            class="action-button error"
            hx-swap="none"
            hx-delete="/htmx/folder/r/@{RequestContext.getRepository.persistedId}"
            hx-trigger="click"
            hx-vals='{"@{Api.Field.ID}": "@{folder.persistedId}"}'>
        Delete "<strong>@{folder.name}</strong>" and move assets into Recycle Bin
    </button>
</div>
