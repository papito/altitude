@import altitude.core.models.Person

@(person: Person)

@* #personName hosts the inline name editor: htmx/edit_person_name swaps in there, and Escape restores
   htmx/view_person_name. *@
@includes.html.results_title_inner("fa-user", person = Some(person)) {
    <span id="personName">@htmx.html.view_person_name(person)</span>
}
