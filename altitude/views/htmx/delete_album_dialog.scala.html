@import altitude.core.RequestContext
@import altitude.core.models.Album
@import altitude.core.Api

@(album: Album, title: String)

@* Focus returns to the "Add album" button; the list renderer moves it to the empty-state button if that was the last album *@
<div id="deleteAlbum"
     data-app-fragment="modal"
     data-app-modal-title="@{title}"
     data-app-dialog-return-focus="#addAlbumBtn"
     data-app-success-event="ALBUM_DELETED_EVENT"
     data-app-success-detail='{"@{Api.Field.ID}":"@{album.persistedId}"}'>

    <button type="button"
            class="action-button error"
            hx-swap="none"
            hx-delete="/htmx/album/r/@{RequestContext.getRepository.persistedId}"
            hx-trigger="click"
            hx-vals='{"@{Api.Field.ID}": "@{album.persistedId}"}'>
        Delete "<strong>@{album.name}</strong>" (its assets are not affected)
    </button>
</div>
