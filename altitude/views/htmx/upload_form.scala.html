@import altitude.core.RequestContext
@import altitude.core.util.Util
@import altitude.core.Api

@(uploadId: String = Util.randomStr())

<form id="uploadForm"
      data-app-fragment="upload-form"
      data-app-upload-url="/import/r/@{RequestContext.getRepository.persistedId}/upload/@{uploadId}"
      data-app-upload-cancel-url="/import/r/@{RequestContext.getRepository.persistedId}/upload/@{uploadId}/cancel">
    <div>
        <input type="file" name="files" id="files" multiple>
    </div>

    <div id="stayOnPage" hidden>
        Files are being uploaded - do not navigate from this page
    </div>

    <div id="progressBarControl" hidden>
        <progress id='progressBar' value='0' max='100'></progress>
    </div>

    <div id="progressTextControl" hidden>
    </div>

    <div id="startUploadButtonControl">
        <button class="action-button primary">Upload from computer</button>
    </div>

    <div id="abortUploadButtonControl" hidden>
        <button id="abortButton"
                type="button"
                data-app-upload-abort
                class="action-button error">Cancel
        </button>
    </div>
</form>
