@import altitude.core.RequestContext
@import altitude.core.models.Stats

@(stats: Stats)

<!DOCTYPE html>

<html lang="en">
  <head>
    <title>ALTITUDE</title>

    @includes.html.header_common()

    <style>
      main {
        display: grid;
        grid-template-rows: max-content auto;
        row-gap: var(--section-vertical-space);
      }

      #importOptions {
        padding-top: calc(var(--section-vertical-space) * 2);
        display: grid;
        align-items: start;
        grid-template-columns: 1fr auto 1fr;
      }

      #browseForFiles {
        grid-column: 2;
        width: 100%;
        display: grid;
        padding: 20px;
        border: var(--form-border);
        border-radius: 5px;
        place-items: center;
        background-color: var(--background-form-color);
      }

      #importLog {
        border-top: var(--form-border);
      }
    </style>
  </head>

  <body>
    <nav>
      @includes.html.nav(stats = stats)
    </nav>

    <main>
      <div id="importOptions">
        <div id="browseForFiles">
          @htmx.html.upload_form()
        </div>
      </div>

      <div id="importLog">
        <div hx-ext="ws" ws-connect="/import/status?userId=@{ RequestContext.getAccount.id.get }">
          <div id="statusText"></div>
        </div>
      </div>
    </main>

    <footer></footer>

    <script src="/static/js/lib/ws.js"></script>
    <script type="module" src="/static/js/upload-form-page.js"></script>

    <script type="module">
      import { highlightNav } from "/static/js/common/navigation.js"

      highlightNav("import")
    </script>

    <script type="module">
      htmx.on("htmx:wsOpen", function (evt) {
          console.debug("WS connection is OPEN")
      })

      htmx.on("htmx:wsClose", function (evt) {
          console.debug("WS connection is CLOSED")
      })

      htmx.on("htmx:wsAfterMessage", function (evt) {
          const statusTextEl = htmx.find("#statusText")
          // sometimes empty pings come through
          if (evt.detail.message && evt.detail.message !== "X") {
              statusTextEl.style.display = "block"
          }

          setTimeout(function () {
              statusTextEl.innerHTML = ""
              statusTextEl.style.display = "none"
          }, 3000)
      })

      // keep refreshing the nav for updated counts
      setInterval(() => {
          htmx.ajax(
              "GET",
              "/htmx/nav/r/" + "@{RequestContext.getRepository.persistedId}",
              {
                  swap: "innerHTML",
                  target: "nav",
              },
    )
      }, 5000)
    </script>
  </body>
</html>
