@(redirect: Option[String] = None)

<p>Please login:</p>

<form action="/login" method="post">
    <p>
        <label for="login">Email or username</label><br>
        <input type="text" id="login" name="login" autocomplete="username" autocapitalize="none" spellcheck="false"/><br>
        <label for="password">Password</label><br>
        <input type="password" id="password" name="password" autocomplete="current-password"/><br/>
        @redirect.map { r =>
        <input type="hidden" name="redirect" value="@r"/>
        }
    </p>
    <p>
        <input type="submit">
    </p>
</form>
