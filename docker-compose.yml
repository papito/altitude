version: '3'
services:
  altitude_core_postgres_dev_db:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    ports:
      - "5432:5432"
    networks:
      - db
    environment:
      - POSTGRES_NAME=altitude
      - POSTGRES_USER=altitude
      - POSTGRES_PASSWORD=dba
    container_name: altitude-core-postgres-dev
networks:
  db:
    driver: bridge
